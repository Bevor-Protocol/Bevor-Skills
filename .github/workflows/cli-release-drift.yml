name: Check latest CLI release drift

on:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install latest published CLI
        run: python -m pip install --upgrade bevor-cli
      - name: Compare release contract and validate examples
        id: check
        continue-on-error: true
        run: python skills/bevor/scripts/check_cli_contract.py
      - name: Generate reviewable update
        if: steps.check.outcome == 'failure'
        run: |
          mkdir -p drift-artifact
          python -m pip freeze > drift-artifact/environment.txt
          python skills/bevor/scripts/check_cli_contract.py --update > drift-artifact/validation.txt 2>&1 || true
          git diff -- skills/bevor/references/cli-command-tree.md tests/fixtures > drift-artifact/cli-release.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.check.outcome == 'failure'
        with:
          name: cli-release-drift
          path: drift-artifact/
      - name: Report drift for review
        if: steps.check.outcome == 'failure'
        run: |
          echo "Published CLI changed. Review the update artifact, workflow recipes, and release pin."
          exit 1
