name: Validate Bevor skill

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install tested CLI release
        run: python -m pip install "bevor-cli==$(cat tests/fixtures/cli-release.txt)" -r tests/fixtures/cli-dependencies.txt
      - name: Run skill contract tests
        run: python -m unittest discover -s tests -v
      - name: Check generated command contract and documented examples
        run: python skills/bevor/scripts/check_cli_contract.py
      - name: Check public documentation links
        run: python skills/bevor/scripts/check_docs_links.py
